# Workflow name shown in GitHub Actions
name: Infrastructure CI/CD

# When this workflow should run
on:
  # Trigger on push to main branch
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml" # Trigger when any workflow YAML file changes

  # Trigger on pull requests to main branch
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml" # Trigger when any workflow YAML file changes

  # Allow manual execution from GitHub UI
  workflow_dispatch:

jobs:
  # Terraform validation job
  terraform-validation:
    name: Terraform Validation

    # Use Ubuntu runner
    runs-on: ubuntu-latest

    # Run all commands inside terraform directory
    defaults:
      run:
        working-directory: terraform

    steps:
      # Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up AWS credentials from secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Install Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform file formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate