# Workflow name shown in GitHub Actions
name: Infrastructure CI/CD

# When this workflow should run
on:
  # Trigger on push to the main branch
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/*.yaml" # Trigger when any workflow YAML file changes

  # Trigger on pull requests targeting the main branch
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/*.yaml" # Trigger when any workflow YAML file changes

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  # Terraform CI job
  terraform:
    name: Terraform

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Execute all commands inside the terraform directory
    defaults:
      run:
        working-directory: terraform

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -input=false