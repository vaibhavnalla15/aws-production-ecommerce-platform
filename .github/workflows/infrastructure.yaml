# Workflow name shown in GitHub Actions
name: Infrastructure CI/CD

# When this workflow should run
on:
  # Trigger on push to the main branch
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yaml" # Trigger when any workflow YAML file changes

  # Trigger on pull requests targeting the main branch
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yaml" # Trigger when any workflow YAML file changes

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  # Terraform CI job
  terraform:
    name: Terraform

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Execute all commands inside the terraform directory
    defaults:
      run:
        working-directory: terraform

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.3

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Generate terraform.tfvars from GitHub Variables and Secrets
      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region   = "${{ vars.AWS_REGION }}"
          project_name = "${{ vars.PROJECT_NAME }}"
          environment  = "${{ vars.ENVIRONMENT }}"

          vpc_cidr = "${{ vars.VPC_CIDR }}"

          availability_zones = ${{ vars.AVAILABILITY_ZONES }}

          public_subnet_cidrs = ${{ vars.PUBLIC_SUBNET_CIDRS }}

          private_subnet_cidrs = ${{ vars.PRIVATE_SUBNET_CIDRS }}

          instance_type = "${{ vars.INSTANCE_TYPE }}"

          db_name     = "${{ vars.DB_NAME }}"
          db_username = "${{ vars.DB_USERNAME }}"
          db_password = "${{ secrets.DB_PASSWORD }}"

          domain_name = "${{ vars.DOMAIN_NAME }}"

          root_domain_name = "${{ vars.ROOT_DOMAIN_NAME }}"
          subdomain        = "${{ vars.SUBDOMAIN }}"

          docker_image     = "${{ vars.DOCKER_IMAGE }}"
          docker_image_tag = "${{ vars.DOCKER_IMAGE_TAG }}"

          application_port = ${{ vars.APPLICATION_PORT }}
          EOF

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # Upload Terraform plan as a workflow artifact
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: terraform/tfplan
          retention-days: 7
