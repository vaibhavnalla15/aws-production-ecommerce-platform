# Workflow name shown in GitHub Actions
name: Application CI/CD

# When this workflow should run
on:
  # Trigger on push to the main branch
  push:
    branches:
      - main
    paths:
      - "cloudcart/**"
      - ".github/workflows/*.yaml" # Trigger when any workflow YAML file changes

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  # Docker CI job
  docker:
    name: Docker

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Enable Docker Buildx
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./cloudcart
          file: ./cloudcart/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcart:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=CloudCart
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            
